<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECLAT | Catálogo de Perfumería</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="header-principal">
        <div class="logo-container">
            <h1>ECLAT</h1>
            <p>Alta Perfumería & Tendencias</p>
        </div>
        <nav class="nav-bar">
            <a href="#catalogo">Catálogo</a>
            <a href="https://www.instagram.com/eclat.quilla" target="_blank" class="instagram-link">
                📸 @eclat.quilla
            </a>
            <div id="carrito-icono" class="carrito-btn">🛒 Carrito (<span id="contador-carrito">0</span>)</div>
        </nav>
    </header>

    <main>
        <section id="catalogo" class="seccion-catalogo">
            <h2>Referencias en Tendencia</h2>
            <div id="contenedor-tarjetas" class="grid-productos">
                <!-- Las tarjetas se cargarán dinámicamente desde JavaScript -->
            </div>
        </section>

        <!-- Sección de Contacto / Formulario obligatorio -->
        <section class="seccion-contacto">
            <h2>Contáctanos</h2>
            <form id="form-contacto">
                <div class="campo-form">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo-form">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo-form">
                    <label for="interes">Fragancia de interés:</label>
                    <select id="interes" name="interes" required>
                        <option value="">Selecciona una opción</option>
                        <option value="9pm">Afnan 9PM</option>
                        <option value="khamrah">Lattafa Khamrah</option>
                        <option value="jeanpaul">JPG Le Male Le Parfum</option>
                        <option value="sauvage">Dior Sauvage</option>
                        <option value="asad">Lattafa Asad</option>
                    </select>
                </div>

                <div class="campo-form checkbox-container">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto recibir información y promociones</label>
                </div>

                <button type="submit" class="btn-agregar">Enviar Mensaje</button>
            </form>
        </section>

        <!-- Modal del Carrito -->
        <div id="modal-carrito" class="modal oculto">
            <div class="modal-contenido">
                <h3>Tu Carrito de Compras</h3>
                <ul id="lista-carrito"></ul>
                <p id="total-carrito">Total: $0</p>
                <button id="cerrar-carrito" class="btn-cerrar">Cerrar</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ECLAT. Todos los derechos reservados. Barranquilla, Colombia.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
